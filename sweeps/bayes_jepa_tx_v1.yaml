# Bayes sweep over a TRANSFORMER ENCODER on FROZEN Mol-JEPA's 13 tokens.
#
# The sibling of `bayes_jepa_v1.yaml` (which sweeps an MLP over a flattened readout) and of
# `bayes_v1.yaml` (which fine-tunes MiniMol), and deliberately the same machinery:
# `method: bayes`, the objective `final/goal_metric_mean` maximised, no `early_terminate`, the
# full 5x2 grid on every trial, one configuration = one wandb run through `src/run_config.py`.
# The loss, the metrics, the objective, the CSV and the splits are identical across all three
# -- that is the point of the branch, and it is what makes these numbers comparable at all.
#
# What changes is the axes. The encoder never moves, so `freeze_epochs`, `unfrozen_epochs`,
# `trunk_lr` and `head_lr_unfrozen` have no referent: one phase, one cosine, no trunk
# parameter group. And the architecture itself is pinned by Ethan at 2 blocks x 4 heads, so
# what is left is two architecture choices nothing settles (`pooling`, `token_source`) plus
# width and optimisation.
#
# COST, MEASURED -- this is a smaller search than it looks. 15 s/epoch against the MLP arm's
# 1.9, so ~5 min per model and **~50 min for a full 5x2 trial**, not the ~7 min the MLP arm
# costs. Two structural causes: the input is 13x larger (`[B, 13, 512]` against `[B, 1024]`),
# and `run_config.py` calls `train_jepa.main()` in-process per model, so the 8.83 GB token
# array is loaded ten times per trial. That is ~29 trials/day per GPU, ~86 across the three on
# this box.
#
# Eight axes at ~86 trials/day is a thinner search than the MLP arm gets, and bayes' advantage
# over random search shrinks with dimension. If it needs cutting, drop `weight_decay` and
# `dropout` first -- they are the two least likely to interact with the architecture question
# this sweep exists to answer, which is whether attention over the 13 tokens beats flattening
# two of them.

program: scripts/sweep_trial.sh
method: bayes

metric:
  name: final/goal_metric_mean
  goal: maximize

# NO ABSOLUTE INTERPRETER PATH HERE -- see bayes_v1.yaml's block for why. `${args}` expands to
# one `--<key>=<value>` per parameter, spelled with underscores; `train.dashed` normalises
# them and `run_config.py` reuses it. `--wandb-tags` is `nargs="*"`, so it goes LAST.
command:
  - ${env}
  - ${program}
  - ${args}
  - --wandb-tags
  - sweep
  - bayes_jepa_tx_v1

# No `early_terminate`, for the same reason as the MiniMol sweep: hyperband prunes on the
# intermediate value, which systematically penalises long-anneal schedules. `epochs` is a
# swept axis here too, so pruning on it would decide the sweep before it started.

parameters:

  # -- the program, and the architecture Ethan pinned ---------------------------------------

  trainer:
    value: train_jepa

  # A transformer encoder over the 13 tokens, rather than an MLP over a flattened readout.
  # The MLP arm must either discard 11 tokens or concatenate all of them into 6656 flat
  # dimensions -- and on the fold-0 scan the concatenation scored WORSE than the two real
  # tokens alone. Neither lets the model relate one token to another, which is what attention
  # is for. `--readout` is ignored under this head; `--token-source` replaces it.
  head:
    value: token_transformer

  # PINNED BY ETHAN, deliberately out of the sweep, so any result is attributable to the
  # architecture as specified rather than to a search over architectures.
  n_blocks:
    value: 2
  n_heads:
    value: 4

  # -- the cost dial ------------------------------------------------------------------------

  # Comma-separated STRINGS, not YAML lists -- a YAML list reaches the agent as
  # `--fold_list=[0, 1]`, which the shell splits and argparse rejects.
  fold_list:
    value: "0,1,2,3,4"
  seed_list:
    value: "0,1"

  # -- swept: the two architecture choices with no settled answer ---------------------------

  # How the 13 contextualised tokens collapse to one vector. There is no argument that settles
  # it: mean reads every token out, max lets one dominate. Swept rather than assumed.
  pooling:
    values: [mean, max]

  # Raw Mol-JEPA transformer output, or each token through its own `modality_pred[i]` head.
  # The fold-0 scan favoured raw (emb:* 0.8084 vs proj:* 0.7782) -- but that was measured with
  # a flattened LINEAR readout, and an attention stack may well prefer the projected space,
  # which is where JEPA's own training objective lives. Not transferable evidence, so swept.
  token_source:
    values: [raw, projected]

  # -- swept: width and optimisation --------------------------------------------------------

  dim_feedforward:
    distribution: q_log_uniform_values
    min: 256
    max: 4096
    q: 1

  dropout:
    distribution: uniform
    min: 0.0
    max: 0.3

  head_lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01

  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1

  epochs:
    distribution: q_log_uniform_values
    min: 3
    max: 60
    q: 1

  # SWEPT HERE, unlike in both other arms, which pin it at 1200. That pin rested on two
  # arguments and only one of them transfers. The throughput half was measured on MiniMol's
  # GNN and says nothing about a 2-block attention stack over 13 tokens. The other half is a
  # property of the DATA, not the model, and still holds: positives are 0.95% of rows and
  # `balanced` weighting puts roughly half the loss mass on them, so a small batch leaves that
  # half riding on two or three molecules.
  #
  #     batch    expected positives/batch    steps/epoch
  #       512            4.9                    518
  #      1200           11.4                    221
  #      4096           39                       65
  #
  # Hence 512 at the bottom -- below it the tail term is noise -- and 4096 at the top, where
  # a 3-epoch trial is already down to ~200 optimizer steps in total. Memory is not the
  # binding constraint at either end: batch 1200 used 1918 MiB of 49140.
  #
  # Note this axis is strongly correlated with `head_lr` -- a bigger batch wants a bigger
  # step -- so some trials will fail for the pairing rather than for either value, and
  # attribution on the lr axis is correspondingly noisier.
  batch_size:
    distribution: q_log_uniform_values
    min: 512
    max: 4096
    q: 1

  # -- pinned, and why ----------------------------------------------------------------------

  # The four loss weights at the same values as both other arms, so the loss is unchanged and
  # a goal_metric here is comparable to the MLP arm's and to frozen MiniMol's.
  w_cls:
    value: 0.4418
  w_pair:
    value: 7.486
  w_std:
    value: 0.7911
  huber_delta:
    value: 1.0513


  # The two MLP layers after pooling keep the MLP arm's defaults, and the task heads stay
  # linear so the bottleneck output is still the exported encoder.
  hidden_dim:
    value: 1024
  embed_dim:
    value: 1024
  cls_n_layers:
    value: 0
  reg_n_layers:
    value: 0

  weights:
    value: balanced
  pprop_norm:
    value: zscore
  eta_min:
    value: 1.0e-8
  lr_schedule:
    value: cosine
  w_vic:
    value: 0.0
